name: Release APK

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: # manual run: builds the APK as a downloadable artifact only

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build && pnpm exec cap sync android

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG=$(node -p "require('./package.json').version")
          [ "v$PKG" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json v$PKG"; exit 1; }

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No signing secret – APK will be debug-signed"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SCT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SCT_KEYSTORE_PASSWORD: ${{ secrets.SCT_KEYSTORE_PASSWORD }}
          SCT_KEY_ALIAS: ${{ secrets.SCT_KEY_ALIAS }}
          SCT_KEY_PASSWORD: ${{ secrets.SCT_KEY_PASSWORD }}
        run: node scripts/build-apk.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist-apk/SimpleCurveCounter-v*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-apk/SimpleCurveCounter-v*.apk --title "Simple Curve Counter $GITHUB_REF_NAME" --generate-notes
