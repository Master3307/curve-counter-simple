name: TestFlight

# Builds the iOS app and uploads it to App Store Connect → TestFlight.
# Needs a paid Apple Developer account, the app created in App Store Connect
# (bundle ID com.korbi.curvecountersimple) and these repository secrets:
#   ASC_KEY_ID       App Store Connect API key ID
#   ASC_ISSUER_ID    API key issuer ID
#   ASC_KEY_P8       contents of AuthKey_XXXX.p8, base64-encoded
#   APPLE_TEAM_ID    10-character team ID
# Without them the job only checks that the app compiles (no signing, no upload).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build && pnpm exec cap sync ios

      - name: Version from package.json
        run: |
          V=$(node -p "require('./package.json').version")
          IFS=. read -r MA MI PA <<< "$V"
          echo "MARKETING_VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((MA*10000 + MI*100 + PA)).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Check secrets
        id: secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::No App Store Connect secrets – compiling only, no TestFlight upload"
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$ASC_KEY_P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile only (no signing)
        if: steps.secrets.outputs.have == 'false'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" build

      - name: Archive and upload to TestFlight
        if: steps.secrets.outputs.have == 'true'
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          sed "s/__TEAM_ID__/$TEAM_ID/" ../ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
          echo "✔ Uploaded $MARKETING_VERSION ($BUILD_NUMBER) – it shows up in TestFlight after Apple's processing."
